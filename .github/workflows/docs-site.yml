name: Documentation

on:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'documentation/**'
      - 'guides/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - '.github/workflows/docs-site.yml'
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'documentation/**'
      - 'guides/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - '.github/workflows/docs-site.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
