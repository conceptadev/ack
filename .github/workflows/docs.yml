name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
      - 'llms.txt'
  # No `branches:` filter. A stacked pull request targets its parent branch,
  # not main, and would otherwise run no documentation checks.
  pull_request:
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
      - 'docs.json'
      - 'llms.txt'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.5.3

      - name: Install documentation dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Type-check documentation
        working-directory: docs-site
        run: pnpm typecheck

      - name: Build production documentation
        working-directory: docs-site
        env:
          DOCS_BASE_PATH: /ack
          NEXT_PUBLIC_SITE_URL: https://concepta.dev/ack
        run: pnpm build

      - name: Verify static output
        run: |
          set -euo pipefail
          test -s docs-site/out/index.html
          test -s docs-site/out/core-concepts/schemas/index.html
          grep -q '/ack/_next/' docs-site/out/index.html
          test ! -e docs.json
          ! grep -R --line-number 'docs\.page/conceptadev/ack' docs README.md
