name: Publish to pub.dev

on:
  push:
    tags:
      # Stable tags, e.g. v1.2.3
      - 'v[0-9]*.[0-9]*.[0-9]*'
      # Pre-release tags, e.g. v1.2.3-beta.1 / v1.2.3-rc.1
      - 'v[0-9]*.[0-9]*.[0-9]*-*'

jobs:
  publish-foundations:
    name: Publish foundation packages
    uses: ./.github/workflows/publish-packages.yml
    permissions:
      contents: read
      id-token: write
    with:
      packages_folder_path: "packages"
      packages: |
        ack
        ack_annotations

  publish-generator:
    name: Publish generator package
    needs: publish-foundations
    uses: ./.github/workflows/publish-packages.yml
    permissions:
      contents: read
      id-token: write
    with:
      packages_folder_path: "packages"
      packages: |
        ack_generator

  publish-adapters:
    name: Publish adapter packages
    needs: publish-generator
    uses: ./.github/workflows/publish-packages.yml
    permissions:
      contents: read
      id-token: write
    with:
      packages_folder_path: "packages"
      packages: |
        ack_json_schema_builder
        ack_firebase_ai
