builders:
  # Phase 1. Writes the generated model classes and schemas to source, so the
  # JSON phase can resolve them as ordinary library members.
  ack_models:
    import: "package:ack_generator/builder.dart"
    builder_factories: ["ackModelBuilder"]
    build_extensions: {".dart": [".ack.dart"]}
    auto_apply: dependents
    build_to: source
    runs_before:
      - ack_generator|ack_model_json
    applies_builders:
      - ack_generator|ack_model_json
    defaults:
      generate_for:
        exclude:
          - "**/*.ack.dart"
          - "**/*.g.dart"

  # Phase 2. Emits a shared part, so source_gen's combining builder merges the
  # Ack JSON code into the ordinary `.g.dart` beside any json_serializable
  # output that the same library produces.
  ack_model_json:
    import: "package:ack_generator/builder.dart"
    builder_factories: ["ackModelJsonBuilder"]
    build_extensions: {".dart": [".ack_model_json.g.part"]}
    auto_apply: none
    build_to: cache
    required_inputs: [".ack.dart"]
    applies_builders:
      - source_gen|combining_builder
